<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — MoodMap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #fff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #f9fafb; }
      .card { background: #1a1a1a; border-color: rgba(255,255,255,0.08); }
      .btn-secondary { background: #262626; color: #e5e7eb; }
      .btn-secondary:hover { background: #333; }
    }
    .icon {
      width: 64px; height: 64px;
      background: #1B3A6B;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { width: 32px; height: 32px; color: #fff; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.9375rem; line-height: 1.6; max-width: 320px; margin: 0 auto 2rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 280px; }
    button, a {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.9375rem; font-weight: 500;
      cursor: pointer; text-decoration: none;
      border: none; transition: opacity 0.15s;
    }
    button:active, a:active { opacity: 0.8; }
    .btn-primary { background: #1B3A6B; color: #fff; }
    .btn-primary:hover { background: #12274A; }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="icon">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
    </svg>
  </div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion internet et réessayez. Les pages consultées récemment sont disponibles en cache.</p>
  <div class="actions">
    <button class="btn-primary" onclick="window.location.reload()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Réessayer
    </button>
    <a class="btn-secondary" href="/fr">Retour à l'accueil</a>
  </div>
</body>
</html>
